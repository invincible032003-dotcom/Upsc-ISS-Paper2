<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Offline Mock Exam Platform</title>
<script>
/* Applied synchronously, before first paint, to avoid a flash of the wrong
   theme. A stored explicit choice (iss_p2_theme: "light"/"dark") wins;
   otherwise the OS preference decides via the CSS media query, and this
   just leaves data-theme unset. */
(function(){
  try{
    var t = localStorage.getItem("iss_p2_theme");
    if(t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand" data-action="go-home"><span class="dot"></span> <span class="faint" style="color:rgba(255,255,255,.75); font-weight:400;">Offline Mock</span></div>
    <div class="topbar-actions">
      <input type="text" id="global-search" placeholder="Search questions, topics, years..." aria-label="Search questions, topics and years" data-action="search-input">
      <button id="theme-toggle-btn" data-action="toggle-theme" aria-label="Toggle dark mode">&#127769;</button>
      <button data-action="export-progress">Export</button>
      <button data-action="import-progress">Import</button>
      <button data-action="reset-progress">Reset</button>
    </div>
  </div>
  <main id="app-root"></main>
  <footer class="appfoot">100% offline - no server, no CDN, no internet required. All data stays in this browser's local storage.</footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="import-file-input" accept="application/json" style="display:none">
<script src="questions2.js"></script>
<script src="forecast.js"></script>
<script src="prestorm.js"></script>
<script>
(function(){
"use strict";

/* =========================================================================
   0. DATA INDICES
   ========================================================================= */
var ALL_Q = (window.quizDataPaper2 || []).slice();
/* Forecast questions are AI-generated, NOT authentic PYQs. Kept in a
   completely separate array from ALL_Q so they can never leak into a
   year/sectional/topic/custom/search PYQ mock - only the dedicated
   Forecast Sectional Mocks flow ever reads ALL_FORECAST_Q. They share
   the BY_ID lookup (id namespaces "2018-P2-Q01" vs "F-LM-01" never
   collide) purely so bookmarks/mistakes/history/retry - all keyed by
   id - work uniformly for both without duplicating that machinery. */
var ALL_FORECAST_Q = (window.forecastDataPaper2 || []).slice();
var FORECAST_SECTIONS = ["Linear Models", "Estimation", "Hypothesis Testing"];
/* PreStorm questions are from a third-party mock-test series (not an
   official UPSC paper, not AI-generated) - the questions and answer key
   are as printed, only the Exam Shortcut is AI-derived. Kept in its own
   array for the same reason as ALL_FORECAST_Q: never leak into the
   authentic-PYQ year/sectional/topic/custom/search flows. */
var ALL_PRESTORM_Q = (window.prestormDataPaper2 || []).slice();
var PRESTORM_TEST_NUMBERS = Array.from(new Set(ALL_PRESTORM_Q.map(function(q){return q.testNo;}))).sort(function(a,b){return a-b;});
var BY_ID = {};
ALL_Q.forEach(function(q){ BY_ID[q.id] = q; });
ALL_FORECAST_Q.forEach(function(q){ BY_ID[q.id] = q; });
ALL_PRESTORM_Q.forEach(function(q){ BY_ID[q.id] = q; });
var YEARS = Array.from(new Set(ALL_Q.map(function(q){return q.year;}))).sort();
var UNIT_ORDER = ["Linear Models","Statistical Inference and Hypothesis Testing","Official Statistics"];
var UNITS = UNIT_ORDER.filter(function(u){ return ALL_Q.some(function(q){return q.unit===u;}); });

function topicsForUnit(unit){
  var seen = {}; var out = [];
  ALL_Q.forEach(function(q){ if(q.unit===unit && !seen[q.topic]){ seen[q.topic]=true; out.push(q.topic); } });
  return out;
}
function subtopicsFor(unit, topic){
  var seen = {}; var out = [];
  ALL_Q.forEach(function(q){ if(q.unit===unit && q.topic===topic && !seen[q.subtopic]){ seen[q.subtopic]=true; out.push(q.subtopic); } });
  return out;
}
var QUESTION_TYPES = Array.from(new Set(ALL_Q.map(function(q){return q.questionType;})));

/* =========================================================================
   1. LOCAL STORAGE (all keys prefixed iss_p2_)
   ========================================================================= */
var LS_PREFIX = "iss_p2_";
function lsGet(key, fallback){
  try{
    var v = localStorage.getItem(LS_PREFIX+key);
    return v ? JSON.parse(v) : fallback;
  }catch(e){ return fallback; }
}
function lsSet(key, val){
  try{ localStorage.setItem(LS_PREFIX+key, JSON.stringify(val)); }catch(e){ /* storage full / unavailable */ }
}
function lsAllKeys(){
  var out = [];
  for(var i=0;i<localStorage.length;i++){
    var k = localStorage.key(i);
    if(k && k.indexOf(LS_PREFIX)===0) out.push(k);
  }
  return out;
}

/* =========================================================================
   2. GENERAL HELPERS
   ========================================================================= */
function escapeHtmlPlain(s){
  return String(s).replace(/[&<>]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; });
}
function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  var h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  function pad(n){ return n<10?"0"+n:""+n; }
  return h>0 ? (h+":"+pad(m)+":"+pad(s)) : (pad(m)+":"+pad(s));
}
function fmtTimeHuman(sec){
  sec = Math.max(0, Math.round(sec));
  var h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  var parts = [];
  if(h) parts.push(h+"h");
  if(m||h) parts.push(m+"m");
  parts.push(s+"s");
  return parts.join(" ");
}
function fmtDate(ts){
  var d = new Date(ts);
  return d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}) + " " + d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
}
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove("show"); }, 2400);
}

/* ---------- Theme (light/dark) ---------- */
function getStoredTheme(){
  try{ return localStorage.getItem("iss_p2_theme"); }catch(e){ return null; }
}
function systemPrefersDark(){
  return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
}
function effectiveTheme(){
  var stored = getStoredTheme();
  if(stored === "light" || stored === "dark") return stored;
  return systemPrefersDark() ? "dark" : "light";
}
function updateThemeButton(){
  var btn = document.getElementById("theme-toggle-btn");
  if(!btn) return;
  var eff = effectiveTheme();
  btn.textContent = eff === "dark" ? "☀️" : "🌙";
  btn.setAttribute("aria-label", eff === "dark" ? "Switch to light mode" : "Switch to dark mode");
}
function toggleTheme(){
  var next = effectiveTheme() === "dark" ? "light" : "dark";
  try{ localStorage.setItem("iss_p2_theme", next); }catch(e){}
  document.documentElement.setAttribute("data-theme", next);
  updateThemeButton();
}
if(window.matchMedia){
  var _mq = window.matchMedia("(prefers-color-scheme: dark)");
  var _onSystemThemeChange = function(){ if(!getStoredTheme()) updateThemeButton(); };
  if(_mq.addEventListener) _mq.addEventListener("change", _onSystemThemeChange);
  else if(_mq.addListener) _mq.addListener(_onSystemThemeChange);
}
function unitBadgeClass(unit){
  if(unit===UNIT_ORDER[0]) return "badge-unit-lm";
  if(unit===UNIT_ORDER[1]) return "badge-unit-si";
  return "badge-unit-os";
}
function unitShort(unit){
  if(unit===UNIT_ORDER[0]) return "Linear Models";
  if(unit===UNIT_ORDER[1]) return "Statistical Inference";
  return "Official Statistics";
}

/* =========================================================================
   3. MINI LaTeX -> HTML MATH RENDERER (offline-safe, no external libs)
   ========================================================================= */
var GREEK_MAP = {
  theta:"θ", Theta:"Θ", mu:"μ", beta:"β", sigma:"σ", Sigma:"Σ",
  alpha:"α", lambda:"λ", Lambda:"Λ", varepsilon:"ε", epsilon:"ε", gamma:"γ", Gamma:"Γ",
  pi:"π", Pi:"Π", chi:"χ", phi:"φ", varphi:"φ", Phi:"Φ", rho:"ρ", delta:"δ", Delta:"Δ",
  omega:"ω", Omega:"Ω", tau:"τ", eta:"η", psi:"ψ", Psi:"Ψ", zeta:"ζ",
  kappa:"κ", nu:"ν", xi:"ξ", Xi:"Ξ", upsilon:"υ", Upsilon:"Υ", iota:"ι"
};
var SYM_MAP = {
  le:"≤", leq:"≤", ge:"≥", geq:"≥", ne:"≠", neq:"≠", approx:"≈",
  equiv:"≡", to:"→", sim:"∼", in:"∈", notin:"∉", mid:"∣", pm:"±", mp:"∓",
  times:"×", cdot:"⋅", infty:"∞", partial:"∂", ldots:"…", dots:"…",
  cdots:"⋯", vdots:"⋮", ddots:"⋱", Rightarrow:"⇒", Leftarrow:"⇐",
  leftrightarrow:"↔", Leftrightarrow:"⇔", forall:"∀", exists:"∃", emptyset:"∅", cup:"∪", cap:"∩",
  subset:"⊂", subseteq:"⊆", supset:"⊃", propto:"∝", perp:"⊥", angle:"∠",
  therefore:"∴", because:"∵", star:"★", circ:"∘", oplus:"⊕", otimes:"⊗",
  mapsto:"↦", gg:"≫", ll:"≪", iff:"⟺", ell:"ℓ"
};
var NOT_MAP = {equiv:"≢", Rightarrow:"⇏", subset:"⊄", subseteq:"⊈", supset:"⊅", supseteq:"⊉", in:"∉", ge:"≱", geq:"≱", le:"≰", leq:"≰", approx:"≉", sim:"≁", exists:"∄", to:"↛"};
var OP_NAMES = {log:1, ln:1, exp:1, max:1, min:1, lim:1, sup:1, inf:1, det:1, gcd:1, arg:1, tan:1, sin:1, cos:1, argmax:1, argmin:1, Var:1, Cov:1, Bias:1, MSE:1, Corr:1, dim:1};
/* Per amsmath convention, these "movable limits" operators stack their
   sub/superscript directly above/below the operator name in display
   style, exactly like \sum/\int/\prod - but keep side scripts in text/
   inline style. det/arg/log/ln/exp/sin/cos/tan etc. always use side
   scripts regardless of style. */
var STACKING_OPS = {gcd:1, inf:1, lim:1, max:1, min:1, sup:1};
var BIGOPS = {sum:"∑", prod:"∏", int:"∫", oint:"∮"};
var RENDER_DISPLAY = false;
var MATHBB_MAP = {R:"ℝ", N:"ℕ", Z:"ℤ", Q:"ℚ", C:"ℂ", E:"ᵐᵉ".length? "𝔼":"E", P:"ℙ", V:"𝕍"};
var MATHCAL_MAP = {A:"𝒜",B:"ℬ",C:"𝒞",D:"𝒟",E:"ℰ",F:"ℱ",G:"𝒢",H:"ℋ",I:"ℐ",J:"𝒥",K:"𝒦",L:"ℒ",M:"ℳ",N:"𝒩",O:"𝒪",P:"𝒫",Q:"𝒬",R:"ℛ",S:"𝒮",T:"𝒯",U:"𝒰",V:"𝒱",W:"𝒲",X:"𝒳",Y:"𝒴",Z:"𝒵"};
var BRACKET_OPEN = {"":"{","":"(","":"[","":"|","":"‖"};
var BRACKET_CLOSE = {"":"}","":")","":"]","":"|","":"‖"};

function preprocessLatex(s){
  return s
    .replace(/\\\\\s*\[[^\]]*\]/g, "\\\\")
    .replace(/\\left\s*\\\{/g, "")
    .replace(/\\right\s*\\\}/g, "")
    .replace(/\\left\s*\(/g, "")
    .replace(/\\right\s*\)/g, "")
    .replace(/\\left\s*\[/g, "")
    .replace(/\\right\s*\]/g, "")
    .replace(/\\left\s*\|/g, "")
    .replace(/\\right\s*\|/g, "")
    .replace(/\\left\s*\\\|/g, "")
    .replace(/\\right\s*\\\|/g, "")
    .replace(/\\left\s*\./g, "")
    .replace(/\\right\s*\./g, "")
    .replace(/\\,/g, " ")
    .replace(/\\;/g, " ")
    .replace(/\\!/g, "")
    .replace(/\\%/g, "%")
    .replace(/\\(?:Bigg|bigg|Big|big)[lr]?(?![a-zA-Z])/g, "")
    .replace(/\\xrightarrow/g, "\\to");
}

function tokenizeLatex(s){
  var tokens = [];
  var i = 0, n = s.length;
  while(i < n){
    var c = s[i];
    if(c === "\\"){
      if(s[i+1] === "\\"){ tokens.push({t:"LINEBREAK"}); i+=2; continue; }
      var j = i+1, name = "";
      while(j<n && /[a-zA-Z]/.test(s[j])){ name += s[j]; j++; }
      if(name.length>0){ tokens.push({t:"CMD", name:name}); i=j; continue; }
      var esc = s[i+1] || "";
      tokens.push({t:"TEXT", v: esc}); i += 2; continue;
    }
    if(c === "{"){ tokens.push({t:"LBRACE"}); i++; continue; }
    if(c === "}"){ tokens.push({t:"RBRACE"}); i++; continue; }
    if(c === "_"){ tokens.push({t:"SUB"}); i++; continue; }
    if(c === "^"){ tokens.push({t:"SUP"}); i++; continue; }
    if(c === "&"){ tokens.push({t:"AMP"}); i++; continue; }
    if(c === "~"){ tokens.push({t:"TEXT", v:" "}); i++; continue; }
    var k = i, buf = "";
    while(k<n && "\\{}_^&~".indexOf(s[k]) === -1){ buf += s[k]; k++; }
    tokens.push({t:"TEXT", v: buf});
    i = k;
  }
  return tokens;
}

function MathParser(tokens){
  this.toks = tokens;
  this.pos = 0;
}
MathParser.prototype.peek = function(off){ return this.toks[this.pos + (off||0)]; };
MathParser.prototype.next = function(){ return this.toks[this.pos++]; };
MathParser.prototype.atEnd = function(){ return this.pos >= this.toks.length; };

MathParser.prototype.parseSequence = function(stop){
  var nodes = [];
  while(!this.atEnd() && !stop(this.peek())){
    nodes.push(this.parseAtomWithScripts());
  }
  return nodes;
};

MathParser.prototype.parseAtomWithScripts = function(){
  var atom = this.parseAtom();
  var sub=null, sup=null, guard=0;
  while(guard++<4){
    var t = this.peek();
    if(t && t.t==="SUB" && !sub){ this.next(); sub = this.readArg(); }
    else if(t && t.t==="SUP" && !sup){ this.next(); sup = this.readArg(); }
    else break;
  }
  if(sub || sup) return {type:"scripts", base:atom, sub:sub, sup:sup};
  return atom;
};

MathParser.prototype.readArg = function(){
  var t = this.peek();
  if(t && t.t==="LBRACE"){
    this.next();
    var body = this.parseSequence(function(tk){ return tk.t==="RBRACE"; });
    this.next();
    return {type:"group", body: body};
  }
  /* A bare (un-braced) argument is exactly ONE character in real LaTeX
     (e.g. x_12 means x-sub-1 followed by literal "2"), but our tokenizer
     merges runs of plain characters into a single TEXT token for
     simplicity elsewhere - so split off just the first character here
     and leave the remainder in place for continued parsing. Per LaTeX's
     own grammar, whitespace right after a control word (\bar y, \hat p)
     is an insignificant separator, not part of the argument - skip any
     leading spaces in that token first, otherwise \bar/\hat/etc. would
     decorate a blank space and leave the real letter undecorated. */
  if(t && t.t==="TEXT"){
    var lead = 0;
    while(lead < t.v.length && t.v.charAt(lead) === " ") lead++;
    if(lead > 0) t.v = t.v.slice(lead);
    if(t.v.length > 1){
      var first = t.v.charAt(0);
      t.v = t.v.slice(1);
      return {type:"text", v:first};
    }
  }
  return this.parseAtom();
};

MathParser.prototype.parseEnvBody = function(envName){
  var self = this;
  var nodes = [];
  while(!this.atEnd()){
    var t = this.peek();
    if(t.t==="CMD" && t.name==="end" && this.peek(1) && this.peek(1).t==="LBRACE" &&
       this.peek(2) && this.peek(2).t==="TEXT" && this.peek(2).v===envName &&
       this.peek(3) && this.peek(3).t==="RBRACE"){
      this.pos += 4;
      break;
    }
    nodes.push(this.parseAtomWithScripts());
  }
  return nodes;
};

function splitRows(nodes){
  var rows = [[]]; var cur = 0;
  nodes.forEach(function(nd){
    if(nd.type==="linebreak"){ rows.push([]); cur++; return; }
    rows[cur].push(nd);
  });
  return rows.map(function(row){
    var cells = [[]]; var c = 0;
    row.forEach(function(nd){
      if(nd.type==="amp"){ cells.push([]); c++; return; }
      cells[c].push(nd);
    });
    return cells;
  });
}

MathParser.prototype.parseAtom = function(){
  var tok = this.next();
  if(!tok) return {type:"text", v:""};
  if(tok.t==="TEXT") return {type:"text", v: tok.v};
  if(tok.t==="AMP") return {type:"amp"};
  if(tok.t==="LINEBREAK") return {type:"linebreak"};
  if(tok.t==="LBRACE"){
    var body = this.parseSequence(function(tk){ return tk.t==="RBRACE"; });
    this.next();
    return {type:"group", body: body};
  }
  if(tok.t==="RBRACE") return {type:"text", v:""};
  if(tok.t==="CMD") return this.parseCommand(tok.name);
  return {type:"text", v:""};
};

MathParser.prototype.parseCommand = function(name){
  if(GREEK_MAP.hasOwnProperty(name)) return {type:"sym", v: GREEK_MAP[name]};
  if(SYM_MAP.hasOwnProperty(name)) return {type:"sym", v: SYM_MAP[name]};
  if(BIGOPS.hasOwnProperty(name)){
    return {type:"bigop", v: BIGOPS[name]};
  }
  if(OP_NAMES.hasOwnProperty(name)) return {type:"op", name: name};
  if(name==="quad") return {type:"space", size:"quad"};
  if(name==="qquad") return {type:"space", size:"qquad"};
  if(name==="displaystyle" || name==="textstyle" || name==="scriptstyle" || name==="limits" || name==="nolimits") return {type:"noop"};
  if(name==="frac" || name==="dfrac" || name==="tfrac"){
    var num = this.readArg(); var den = this.readArg();
    return {type:"frac", num:num, den:den};
  }
  if(name==="sqrt"){
    var body = this.readArg();
    return {type:"sqrt", body: body};
  }
  if(name==="binom" || name==="dbinom" || name==="tbinom"){
    var top = this.readArg(); var bot = this.readArg();
    return {type:"binom", top:top, bottom:bot};
  }
  if(name==="text" || name==="mathrm" || name==="operatorname"){
    var arg = this.readArg();
    return {type:"decorate", deco:"upright", body: arg};
  }
  if(name==="mathbf" || name==="boldsymbol" || name==="bm"){
    var b = this.readArg();
    return {type:"decorate", deco:"bold", body: b};
  }
  if(name==="mathbb"){
    var bb = this.readArg();
    return {type:"decorate", deco:"bb", body: bb};
  }
  if(name==="mathcal" || name==="mathscr"){
    var cal = this.readArg();
    return {type:"decorate", deco:"cal", body: cal};
  }
  if(name==="bar" || name==="overline"){
    var barb = this.readArg();
    return {type:"decorate", deco:"bar", body: barb};
  }
  if(name==="hat" || name==="widehat"){
    var hatb = this.readArg();
    return {type:"decorate", deco:"hat", body: hatb};
  }
  if(name==="tilde" || name==="widetilde"){
    var tb = this.readArg();
    return {type:"decorate", deco:"tilde", body: tb};
  }
  if(name==="dot"){
    var db = this.readArg();
    return {type:"decorate", deco:"dot", body: db};
  }
  if(name==="vec"){
    var vb = this.readArg();
    return {type:"decorate", deco:"vec", body: vb};
  }
  if(name==="underline"){
    var ub = this.readArg();
    return {type:"decorate", deco:"under", body: ub};
  }
  if(name==="underbrace"){
    var ubb = this.readArg();
    return {type:"underbrace", body: ubb};
  }
  if(name==="stackrel"){
    var srTop = this.readArg(); var srBottom = this.readArg();
    return {type:"stackrel", top: srTop, bottom: srBottom};
  }
  if(name==="not"){
    var nt = this.peek();
    if(nt && nt.t==="CMD" && NOT_MAP.hasOwnProperty(nt.name)){
      this.next();
      return {type:"sym", v: NOT_MAP[nt.name]};
    }
    return {type:"sym", v:"̸"};
  }
  if(name==="begin"){
    this.next(); /* LBRACE */
    var envTok = this.next(); /* TEXT env name */
    this.next(); /* RBRACE */
    var envName = envTok ? envTok.v : "";
    var body = this.parseEnvBody(envName);
    var rows = splitRows(body);
    if(envName==="cases") return {type:"cases", rows: rows};
    return {type:"matrix", rows: rows, envName: envName};
  }
  /* Unknown command: safe fallback, render the command name as upright text */
  return {type:"op", name: name};
};

function renderNodes(nodes){
  return nodes.map(renderNode).join("");
}
function bracketSize(rowCount){
  return Math.min(1.5 + Math.max(0,rowCount-1)*0.62, 3.4).toFixed(2)+"em";
}
function braceSize(rowCount){
  return Math.min(1.3 + Math.max(0,rowCount-1)*0.6, 3.4).toFixed(2)+"em";
}
function htmlForTextValue(v){
  var out = ""; var i=0, n=v.length;
  while(i<n){
    var ch = v[i];
    if(BRACKET_OPEN[ch]){ out += '<span class="bracket">'+BRACKET_OPEN[ch]+'</span>'; i++; continue; }
    if(BRACKET_CLOSE[ch]){ out += '<span class="bracket">'+BRACKET_CLOSE[ch]+'</span>'; i++; continue; }
    if(/[0-9.]/.test(ch)){
      var j=i, buf="";
      while(j<n && /[0-9.]/.test(v[j])){ buf+=v[j]; j++; }
      out += '<span class="upright">'+escapeHtmlPlain(buf)+'</span>';
      i=j; continue;
    }
    var k=i, plain="";
    while(k<n && !/[0-9.]/.test(v[k]) && !BRACKET_OPEN[v[k]] && !BRACKET_CLOSE[v[k]]){ plain+=v[k]; k++; }
    out += escapeHtmlPlain(plain);
    i=k;
  }
  return out;
}
function singleLetterOf(node){
  /* \mathbb{R} / \mathcal{R} always arrive braced, so readArg() wraps the
     argument as {type:"group", body:[...]}, never the bare {type:"text"}
     shape - unwrap that one level so the single-letter font-variant maps
     below actually match instead of silently falling back to plain text. */
  if(!node) return null;
  if(node.type==="text" && node.v.length===1) return node.v;
  if(node.type==="group" && node.body && node.body.length===1){
    var inner = node.body[0];
    if(inner.type==="text" && inner.v.length===1) return inner.v;
  }
  return null;
}
function renderNode(node){
  switch(node.type){
    case "text": return htmlForTextValue(node.v);
    case "sym": return escapeHtmlPlain(node.v);
    case "op": return '<span class="op">'+escapeHtmlPlain(node.name)+'</span>';
    case "bigop": return '<span class="bigop">'+node.v+'</span>';
    case "space": return node.size==="qquad" ? '<span class="space-qquad"></span>' : '<span class="space-quad"></span>';
    case "noop": return "";
    case "amp": return "";
    case "linebreak": return "";
    case "group": return renderNodes(node.body);
    case "scripts": {
      var supH = node.sup ? renderNode(node.sup) : "";
      var subH = node.sub ? renderNode(node.sub) : "";
      var baseIsBigop = node.base.type === "bigop";
      var baseIsStackingOp = node.base.type === "op" && STACKING_OPS.hasOwnProperty(node.base.name);
      if((baseIsBigop || baseIsStackingOp) && RENDER_DISPLAY){
        var baseH = renderNode(node.base);
        var stack = '<span class="opstack">';
        if(node.sup) stack += '<span class="opstack-sup">'+supH+'</span>';
        stack += '<span class="opstack-mid">'+baseH+'</span>';
        if(node.sub) stack += '<span class="opstack-sub">'+subH+'</span>';
        stack += '</span>';
        return stack;
      }
      var base = renderNode(node.base);
      if(node.sup && node.sub) return base + '<sup>'+supH+'</sup><sub>'+subH+'</sub>';
      if(node.sup) return base + '<sup>'+supH+'</sup>';
      if(node.sub) return base + '<sub>'+subH+'</sub>';
      return base;
    }
    case "frac":
      return '<span class="frac"><span class="num">'+renderNode(node.num)+'</span><span class="den">'+renderNode(node.den)+'</span></span>';
    case "sqrt":
      return '<span class="sqrt"><svg class="sqrt-radical" viewBox="0 0 32 54" preserveAspectRatio="none"><polyline points="1,33 8,33 15,52 30,2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" vector-effect="non-scaling-stroke"/></svg><span class="sqrt-body">'+renderNode(node.body)+'</span></span>';
    case "binom":
      return '<span class="bracket">(</span><span class="binom-stack"><span class="binom-top">'+renderNode(node.top)+'</span><span class="binom-bottom">'+renderNode(node.bottom)+'</span></span><span class="bracket">)</span>';
    case "underbrace":
      return '<span class="underbrace-wrap"><span class="underbrace-body">'+renderNode(node.body)+'</span><span class="underbrace-brace">⏟</span></span>';
    case "stackrel":
      return '<span class="stackrel-wrap"><span class="stackrel-top">'+renderNode(node.top)+'</span><span class="stackrel-bottom">'+renderNode(node.bottom)+'</span></span>';
    case "decorate": {
      var body = renderNode(node.body);
      switch(node.deco){
        case "bar": return '<span class="decorate-bar">'+body+'</span>';
        case "hat": return '<span class="decorate-hat">'+body+'</span>';
        case "tilde": return '<span class="decorate-tilde">'+body+'</span>';
        case "dot": return '<span class="decorate-dot">'+body+'</span>';
        case "vec": return '<span class="decorate-vec">'+body+'</span>';
        case "under": return '<span style="text-decoration:underline;">'+body+'</span>';
        case "upright": return '<span class="upright">'+body+'</span>';
        case "bold": return '<b>'+body+'</b>';
        case "bb": {
          var bbLetter = singleLetterOf(node.body);
          if(bbLetter && MATHBB_MAP[bbLetter]){
            return escapeHtmlPlain(MATHBB_MAP[bbLetter]);
          }
          return '<b>'+body+'</b>';
        }
        case "cal": {
          var calLetter = singleLetterOf(node.body);
          if(calLetter && MATHCAL_MAP[calLetter]){
            return escapeHtmlPlain(MATHCAL_MAP[calLetter]);
          }
          return '<span class="upright">'+body+'</span>';
        }
        default: return body;
      }
    }
    case "matrix": {
      /* Rendered with span + CSS display:table*, never a real <table>/<tr>/<td>:
         a literal <table> tag inside an open <p> forces the HTML parser to
         implicitly close that <p> (and everything nested above it, spans
         included) before the table, mangling the surrounding markup - see
         renderRich(), which wraps shared-stem text in <p>...</p>. Spans with
         CSS table display are pure phrasing content and never trigger that. */
      var open = node.envName==="bmatrix" ? "[" : node.envName==="vmatrix" ? "|" : node.envName==="Bmatrix" ? "{" : "(";
      var close = node.envName==="bmatrix" ? "]" : node.envName==="vmatrix" ? "|" : node.envName==="Bmatrix" ? "}" : ")";
      var rowsHtml = node.rows.map(function(row){
        return '<span class="mrow">' + row.map(function(cell){ return '<span class="mcell">'+renderNodes(cell)+'</span>'; }).join("") + '</span>';
      }).join("");
      var bsz = bracketSize(node.rows.length);
      return '<span class="matrix"><span class="bracket" style="font-size:'+bsz+'">'+open+'</span><span class="mtable">'+rowsHtml+'</span><span class="bracket" style="font-size:'+bsz+'">'+close+'</span></span>';
    }
    case "cases": {
      var rowsHtml2 = node.rows.map(function(row){
        return '<span class="crow">' + row.map(function(cell,ci){
          return '<span class="ccell'+(ci>0?" case-cond":"")+'">'+renderNodes(cell)+"</span>";
        }).join("") + '</span>';
      }).join("");
      return '<span class="cases"><span class="brace-big" style="font-size:'+braceSize(node.rows.length)+'">{</span><span class="ctable">'+rowsHtml2+'</span></span>';
    }
    default: return "";
  }
}

function renderMathToHtml(latexSrc, isDisplay){
  var prevDisplay = RENDER_DISPLAY;
  try{
    RENDER_DISPLAY = !!isDisplay;
    var pre = preprocessLatex(latexSrc);
    var toks = tokenizeLatex(pre);
    var parser = new MathParser(toks);
    var nodes = parser.parseSequence(function(){ return false; });
    var html = renderNodes(nodes);
    RENDER_DISPLAY = prevDisplay;
    if(isDisplay) return '<span class="mathblock"><span class="math">'+html+'</span></span>';
    return '<span class="math mathinline">'+html+'</span>';
  }catch(e){
    RENDER_DISPLAY = prevDisplay;
    var raw = isDisplay ? ("$$"+latexSrc+"$$") : ("$"+latexSrc+"$");
    return '<span style="font-family:var(--mono);">'+escapeHtmlPlain(raw)+'</span>';
  }
}

/* =========================================================================
   4. RICH TEXT (markdown-lite tables + bold + inline/display math)
   ========================================================================= */
function processInlineMath(raw){
  var tokens = [];
  var replaced = raw.replace(/\$\$([\s\S]+?)\$\$|\$([^$\n]+?)\$/g, function(m, disp, inl){
    var html = (disp!==undefined) ? renderMathToHtml(disp, true) : renderMathToHtml(inl, false);
    tokens.push(html);
    return "M"+(tokens.length-1)+"";
  });
  var escaped = escapeHtmlPlain(replaced);
  escaped = escaped.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  escaped = escaped.replace(/\n/g, "<br>");
  escaped = escaped.replace(/M(\d+)/g, function(m, i){ return tokens[Number(i)]; });
  return escaped;
}
function isTableLine(line){ return /^\s*\|/.test(line); }
function renderMarkdownTable(lines){
  var rows = lines.filter(function(l){ return l.trim().length>0; }).map(function(l){
    var t = l.trim();
    if(t.charAt(0)==="|") t = t.slice(1);
    if(t.charAt(t.length-1)==="|") t = t.slice(0,-1);
    return t.split("|").map(function(c){ return c.trim(); });
  });
  if(rows.length && rows[1] && rows[1].every(function(c){ return /^:?-+:?$/.test(c); })){
    var head = rows[0], body = rows.slice(2);
    var thead = "<thead><tr>"+head.map(function(c){ return "<th>"+processInlineMath(c)+"</th>"; }).join("")+"</tr></thead>";
    var tbody = "<tbody>"+body.map(function(r){ return "<tr>"+r.map(function(c){ return "<td>"+processInlineMath(c)+"</td>"; }).join("")+"</tr>"; }).join("")+"</tbody>";
    return "<table>"+thead+tbody+"</table>";
  }
  var tbody2 = "<tbody>"+rows.map(function(r){ return "<tr>"+r.map(function(c){ return "<td>"+processInlineMath(c)+"</td>"; }).join("")+"</tr>"; }).join("")+"</tbody>";
  return "<table>"+tbody2+"</table>";
}
function renderRich(raw){
  if(!raw) return "";
  var lines = String(raw).split("\n");
  var out = []; var buf = []; var tbl = [];
  function flushText(){
    if(buf.length){
      out.push("<p>"+processInlineMath(buf.join("\n"))+"</p>");
      buf = [];
    }
  }
  function flushTable(){
    if(tbl.length){ out.push(renderMarkdownTable(tbl)); tbl = []; }
  }
  lines.forEach(function(line){
    if(isTableLine(line)){ flushText(); tbl.push(line); }
    else { flushTable(); buf.push(line); }
  });
  flushTable(); flushText();
  return '<div class="richtext">'+out.join("")+"</div>";
}
function renderQuestionText(raw){
  return processInlineMath(raw || "");
}

function cloneForRandomizedOptions(q){
  var order = shuffle([0,1,2,3]);
  var newOptions = order.map(function(idx){ return q.options[idx]; });
  var newCorrect = order.indexOf(q.correctAnswer);
  var clone = Object.assign({}, q, { options:newOptions, correctAnswer:newCorrect });
  return clone;
}
function makeMock(title, mode, questions, timeLimitSec, opts){
  opts = opts || {};
  var qs = questions;
  if(opts.randomizeOptions) qs = qs.map(cloneForRandomizedOptions);
  return {
    title: title, mode: mode, questions: qs,
    answers: {}, marked: {}, revealStage: {},
    current: 0, startedAt: Date.now(), timeLimitSec: timeLimitSec || null,
    submitted: false, submittedAt: null
  };
}
function startMock(mock){
  if(!mock || !mock.questions.length){ toast("No questions match this selection."); return; }
  App.mock = mock;
  App.view = "exam";
  render();
  startTimer();
}
function stopTimer(){
  if(App.timerHandle){ clearInterval(App.timerHandle); App.timerHandle = null; }
}
function startTimer(){
  stopTimer();
  if(!App.mock || !App.mock.timeLimitSec) return;
  App.timerHandle = setInterval(function(){
    if(!App.mock || App.mock.submitted){ stopTimer(); return; }
    var elapsed = (Date.now() - App.mock.startedAt)/1000;
    var remaining = App.mock.timeLimitSec - elapsed;
    var el = document.getElementById("exam-timer");
    if(el){
      el.textContent = fmtTime(remaining);
      el.classList.toggle("low", remaining <= 60);
    }
    if(remaining <= 0){
      stopTimer();
      toast("Time up - auto-submitting.");
      submitMock(true);
    }
  }, 1000);
}

function computeResult(mock){
  var correct=0, incorrect=0, unanswered=0;
  var perUnit={}, perTopic={}, perSubtopic={}, perType={}, perYear={};
  function bucket(obj,key){ if(!obj[key]) obj[key]={correct:0,total:0}; obj[key].total++; }
  mock.questions.forEach(function(q,i){
    bucket(perUnit,q.unit);
    bucket(perTopic,q.unit+" › "+q.topic);
    bucket(perSubtopic,q.subtopic);
    bucket(perType,q.questionType);
    bucket(perYear,q.year);
    var a = mock.answers[i];
    if(a===undefined || a===null){ unanswered++; return; }
    if(a===q.correctAnswer){
      correct++;
      perUnit[q.unit].correct++;
      perTopic[q.unit+" › "+q.topic].correct++;
      perSubtopic[q.subtopic].correct++;
      perType[q.questionType].correct++;
      perYear[q.year].correct++;
    } else incorrect++;
  });
  var total = mock.questions.length;
  var attempted = correct+incorrect;
  var percentage = total ? (correct/total*100) : 0;
  var accuracy = attempted ? (correct/attempted*100) : 0;
  var timeTakenSec = Math.round(((mock.submittedAt||Date.now()) - mock.startedAt)/1000);
  var upscMarks = +(correct*2.5 - incorrect*(2.5/3)).toFixed(2);
  var maxMarks = total*2.5;
  return {
    title: mock.title, mode: mock.mode, total: total, attempted: attempted,
    correct: correct, incorrect: incorrect, unanswered: unanswered,
    percentage: percentage, accuracy: accuracy, timeTakenSec: timeTakenSec,
    avgTimePerAttempted: attempted ? timeTakenSec/attempted : 0,
    upscMarks: upscMarks, maxMarks: maxMarks,
    perUnit: perUnit, perTopic: perTopic, perSubtopic: perSubtopic, perType: perType, perYear: perYear,
    timestamp: Date.now()
  };
}
function updateStatsAndMistakes(mock){
  var stats = lsGet("stats", {});
  var mistakes = lsGet("mistakes", []);
  var mistakeSet = {}; mistakes.forEach(function(id){ mistakeSet[id]=true; });
  mock.questions.forEach(function(q,i){
    var a = mock.answers[i];
    if(a===undefined || a===null) return;
    if(!stats[q.id]) stats[q.id] = {attempts:0, correct:0};
    stats[q.id].attempts++;
    if(a===q.correctAnswer){ stats[q.id].correct++; delete mistakeSet[q.id]; }
    else mistakeSet[q.id] = true;
  });
  lsSet("stats", stats);
  lsSet("mistakes", Object.keys(mistakeSet));
}
function pushHistory(mock, result){
  var hist = lsGet("history", []);
  hist.unshift({
    title: result.title, mode: result.mode, timestamp: result.timestamp,
    total: result.total, correct: result.correct, incorrect: result.incorrect, unanswered: result.unanswered,
    percentage: result.percentage, accuracy: result.accuracy, timeTakenSec: result.timeTakenSec,
    questionIds: mock.questions.map(function(q){ return q.id; }),
    answers: mock.answers, marked: mock.marked
  });
  lsSet("history", hist.slice(0,300));
}
function submitMock(isAutoSubmit){
  if(!App.mock || App.mock.submitted) return;
  stopTimer();
  App.mock.submitted = true;
  App.mock.submittedAt = Date.now();
  var result = computeResult(App.mock);
  updateStatsAndMistakes(App.mock);
  pushHistory(App.mock, result);
  App.lastResult = result;
  App.reviewFilter = "all";
  App.view = "result";
  closeModal();
  render();
}

function computeGlobalAnalytics(){
  var stats = lsGet("stats", {});
  var byUnit={}, byTopic={}, byType={}, byYear={};
  var totalAttempts=0, totalCorrect=0;
  Object.keys(stats).forEach(function(qid){
    var s = stats[qid]; var q = BY_ID[qid]; if(!q || q.isForecast || q.isPrestorm) return; /* keep analytics scoped to authentic-PYQ performance */
    totalAttempts += s.attempts; totalCorrect += s.correct;
    function add(obj,key){ if(!obj[key]) obj[key]={attempts:0,correct:0}; obj[key].attempts+=s.attempts; obj[key].correct+=s.correct; }
    add(byUnit,q.unit); add(byTopic,q.unit+" › "+q.topic); add(byType,q.questionType); add(byYear,q.year);
  });
  return {byUnit:byUnit, byTopic:byTopic, byType:byType, byYear:byYear, totalAttempts:totalAttempts, totalCorrect:totalCorrect};
}
function weakTopics(minAttempts, limit){
  var ga = computeGlobalAnalytics();
  var arr = Object.keys(ga.byTopic).map(function(k){
    var v = ga.byTopic[k];
    return {topic:k, accuracy: v.attempts ? v.correct/v.attempts*100 : 0, attempts:v.attempts};
  });
  var qualified = arr.filter(function(x){ return x.attempts>=minAttempts; });
  if(!qualified.length) qualified = arr.filter(function(x){ return x.attempts>0; });
  qualified.sort(function(a,b){ return a.accuracy-b.accuracy; });
  return qualified.slice(0, limit);
}

function checkboxList(idPrefix, items, selected, labelFn){
  return '<div class="check-list">' + items.map(function(it, idx){
    var val = encodeURIComponent(it);
    var checked = selected.indexOf(it)!==-1 ? "checked" : "";
    return '<label class="check-row"><input type="checkbox" data-group="'+idPrefix+'" value="'+val+'" '+checked+'> '+(labelFn?labelFn(it):it)+'</label>';
  }).join("") + '</div>';
}
function viewSetupCustom(){
  var sel = App.customSel;
  var topicsPool = [];
  if(sel.units.length){
    sel.units.forEach(function(u){ topicsForUnit(u).forEach(function(t){ if(topicsPool.indexOf(t)===-1) topicsPool.push(t); }); });
  } else {
    UNITS.forEach(function(u){ topicsForUnit(u).forEach(function(t){ if(topicsPool.indexOf(t)===-1) topicsPool.push(t); }); });
  }
  var subtopicsPool = [];
  var topicsToScan = sel.topics.length ? sel.topics : topicsPool;
  UNITS.forEach(function(u){
    topicsToScan.forEach(function(t){
      subtopicsFor(u,t).forEach(function(s){ if(subtopicsPool.indexOf(s)===-1) subtopicsPool.push(s); });
    });
  });
  var pool = ALL_Q.filter(function(q){
    if(sel.years.length && sel.years.indexOf(q.year)===-1) return false;
    if(sel.units.length && sel.units.indexOf(q.unit)===-1) return false;
    if(sel.topics.length && sel.topics.indexOf(q.topic)===-1) return false;
    if(sel.subtopics.length && sel.subtopics.indexOf(q.subtopic)===-1) return false;
    return true;
  });
  return backBar() + '<div class="card">'
    + '<h2>Custom Mock Generator</h2>'
    + '<div class="grid cols-2">'
    +   '<div><label>Year(s) <span class="faint">(none selected = all years)</span></label>'+checkboxList("cm-year", YEARS, sel.years)+'</div>'
    +   '<div><label>Unit(s) <span class="faint">(none selected = all units)</span></label>'+checkboxList("cm-unit", UNITS, sel.units, function(v){return unitShort(v);})+'</div>'
    + '</div>'
    + '<div class="grid cols-2">'
    +   '<div><label>Topic(s) <span class="faint">(none selected = all topics)</span></label>'+checkboxList("cm-topic", topicsPool, sel.topics)+'</div>'
    +   '<div><label>Subtopic(s) <span class="faint">(none selected = all subtopics)</span></label>'+checkboxList("cm-subtopic", subtopicsPool, sel.subtopics)+'</div>'
    + '</div>'
    + '<div class="grid cols-3">'
    +   '<div class="field"><label>Question count (pool: '+pool.length+')</label><input type="number" id="cm-count" min="1" max="'+Math.max(1,pool.length)+'" value="'+Math.min(sel.count, Math.max(1,pool.length))+'"></div>'
    +   '<div class="field"><label>Order</label><select id="cm-order"><option value="sequential" '+(sel.order==="sequential"?"selected":"")+'>Sequential (original order)</option><option value="random" '+(sel.order==="random"?"selected":"")+'>Randomized</option></select></div>'
    +   '<div class="field"><label>Mode</label>'+modeRadios("cm-mode", sel.mode)+'</div>'
    + '</div>'
    + '<label class="check-row"><input type="checkbox" id="cm-randopt" '+(sel.randomizeOptions?"checked":"")+'> Randomize option order (correct answer mapping updates automatically)</label>'
    + '<div class="btn-row" style="margin-top:12px;"><button class="btn btn-primary" data-action="start-custom" '+(pool.length?"":"disabled")+'>Start Mock ('+pool.length+' available)</button></div>'
    + '</div>';
}

/* ---------------- Exam screen ---------------- */
function paletteState(i){
  var m = App.mock;
  var answered = m.answers[i] !== undefined;
  var marked = !!m.marked[i];
  if(answered && marked) return "answered-marked";
  if(marked) return "marked";
  if(answered) return "answered";
  return "unanswered";
}
function viewExam(){
  var m = App.mock;
  var i = m.current;
  var q = m.questions[i];
  var answered = m.answers[i];
  var isLearning = m.mode==="learning";
  var locked = isLearning && answered!==undefined;

  var metaBadges = q.isForecast
    ? badge(q.section, "badge-ai") + badge(q.topic) + (q.subtopic && q.subtopic!==q.topic ? badge(q.subtopic) : "") + badge(q.questionType)
    : q.isPrestorm
    ? badge("Test "+q.testNo+" Q"+q.questionNumber, "badge-ai") + badge(unitShort(q.unit), unitBadgeClass(q.unit)) + badge(q.topic)
    : badge(q.year+" Q"+q.questionNumber) + badge(unitShort(q.unit), unitBadgeClass(q.unit)) + badge(q.topic) + badge(q.questionType);
  var forecastBanner = q.isForecast ? '<div class="forecast-banner">🔮 '+escapeHtmlPlain(q.provenanceLabel||"FORECAST / AI-GENERATED")+'</div>'
    : q.isPrestorm ? '<div class="forecast-banner">🧪 '+escapeHtmlPlain(q.provenanceLabel||"PRESTORM MOCK SERIES - answer key as printed, shortcut AI-derived")+'</div>' : "";

  var sharedStemHtml = q.sharedStem ? '<div class="shared-stem"><span class="tag">Shared context</span>'+renderRich(q.sharedStem)+'</div>' : "";
  var trailingHtml = q.trailingNote ? '<div class="trailing-note">'+renderQuestionText(q.trailingNote)+'</div>' : "";

  var optionsHtml = q.options.map(function(opt, idx){
    var cls = "option";
    if(!isLearning && answered===idx) cls += " selected";
    if(isLearning && locked){
      if(idx===q.correctAnswer) cls += " correct";
      else if(idx===answered) cls += " incorrect";
      cls += " locked";
    } else if(!isLearning && answered===idx){
      /* selected only, already added */
    }
    var letter = "ABCD"[idx];
    return '<button type="button" class="'+cls+'" data-action="answer" data-idx="'+idx+'" '+(isLearning&&locked?"disabled":"")+'>'
      + '<span class="optlabel">'+letter+'</span><span class="opttext">'+renderQuestionText(opt)+'</span></button>';
  }).join("");

  var feedbackHtml = "";
  if(isLearning && locked){
    var isCorrect = answered===q.correctAnswer;
    var hasTips = q.tipsTricks && q.tipsTricks.length;
    var hasSolution = q.solution && q.solution.length;
    feedbackHtml = '<div class="feedback-panel">';
    feedbackHtml += '<div class="feedback-banner '+(isCorrect?"correct":"incorrect")+'">'
      + (isCorrect ? "✓ Correct" : "✗ Incorrect - correct answer is "+"ABCD"[q.correctAnswer])
      + '</div>';
    /* All shown at once on answering, in order: Step-by-Step Solution,
       Exam Shortcut, Tips & Tricks - no click-to-reveal staging. */
    if(hasSolution){
      feedbackHtml += '<div class="reveal-block"><h4>Step-by-Step Solution</h4><ol>'+q.solution.map(function(s){return "<li>"+renderQuestionText(s.text)+"</li>";}).join("")+'</ol></div>';
    }
    feedbackHtml += '<div class="reveal-block"><h4>Exam Shortcut <span class="ai-note">AI-derived explanation</span></h4>'+renderQuestionText(q.examShortcut||"Not available.")+'</div>';
    if(hasTips){
      feedbackHtml += '<div class="reveal-block"><h4>Tips &amp; Tricks</h4><ul>'+q.tipsTricks.map(function(t){return "<li>"+renderQuestionText(t)+"</li>";}).join("")+'</ul></div>';
    }
    if(q.sourceAmbiguityNote){
      feedbackHtml += '<div class="source-note"><b>Source note:</b> '+renderQuestionText(q.sourceAmbiguityNote)+'</div>';
    }
    feedbackHtml += '</div>';
  }

  var bookmarks = lsGet("bookmarks", []);
  var isBookmarked = bookmarks.indexOf(q.id) !== -1;

  var timerHtml = m.timeLimitSec ? '<span class="timer" id="exam-timer">'+fmtTime(m.timeLimitSec - (Date.now()-m.startedAt)/1000)+'</span>' : '<span class="faint">No timer</span>';

  var answeredCount = Object.keys(m.answers).length;
  var markedCount = Object.keys(m.marked).filter(function(k){return m.marked[k];}).length;

  var paletteHtml = m.questions.map(function(_,idx){
    var st = paletteState(idx);
    var stLabel = st==="answered-marked" ? "answered, marked for review" : st==="marked" ? "marked for review" : st;
    var label = "Question "+(idx+1)+", "+stLabel+(idx===i?", current":"");
    return '<button type="button" class="pnum '+st+' '+(idx===i?"current":"")+'" data-action="jump" data-idx="'+idx+'" aria-label="'+label+'">'+(idx+1)+'</button>';
  }).join("");

  return ''
  + '<div class="exam-header">'
  +   '<div><b>'+escapeHtmlPlain(m.title)+'</b> <span class="faint">'+(m.mode==="strict"?"Strict Exam":"Learning Mode")+'</span></div>'
  +   '<div class="progress-text">Question '+(i+1)+' / '+m.questions.length+'</div>'
  +   timerHtml
  +   '<button class="btn btn-danger btn-sm" data-action="confirm-submit">Submit</button>'
  + '</div>'
  + '<div class="exam-layout">'
  +   '<div class="card qcard">'
  +     forecastBanner
  +     '<div class="qmeta">'+metaBadges+'<button class="btn btn-ghost btn-sm" style="margin-left:auto;" data-action="toggle-bookmark" data-id="'+q.id+'">'+(isBookmarked?"★ Bookmarked":"☆ Bookmark")+'</button></div>'
  +     sharedStemHtml
  +     '<div class="qtext">'+renderRich(q.question)+'</div>'
  +     trailingHtml
  +     '<div class="options">'+optionsHtml+'</div>'
  +     feedbackHtml
  +     '<div class="qactions">'
  +       '<div class="btn-row">'
  +         '<button class="btn" data-action="prev" '+(i===0?"disabled":"")+'>&larr; Previous</button>'
  +         '<button class="btn" data-action="next" '+(i===m.questions.length-1?"disabled":"")+'>Next &rarr;</button>'
  +       '</div>'
  +       '<button class="btn '+(m.marked[i]?"btn-primary":"")+'" data-action="toggle-mark">'+(m.marked[i]?"✓ Marked for Review":"Mark for Review")+' <span class="kbd">M</span></button>'
  +     '</div>'
  +   '</div>'
  +   '<div class="card palette-card">'
  +     '<h3>Question Palette</h3>'
  +     '<div class="palette-legend">'
  +       '<span><span class="legend-dot" style="background:var(--success)"></span>Answered</span>'
  +       '<span><span class="legend-dot" style="background:var(--marked)"></span>Marked</span>'
  +       '<span><span class="legend-dot" style="background:#fff;border:1px solid var(--border)"></span>Unanswered</span>'
  +     '</div>'
  +     '<div class="palette-grid">'+paletteHtml+'</div>'
  +     '<div style="margin-top:12px;font-size:12.5px;" class="muted">Answered: '+answeredCount+'/'+m.questions.length+' &middot; Marked: '+markedCount+'</div>'
  +     '<button class="btn btn-danger btn-block" style="margin-top:10px;" data-action="confirm-submit">Submit '+(m.mode==="strict"?"Exam":"Mock")+'</button>'
  +   '</div>'
  + '</div>';
}

/* ---------------- Result screen ---------------- */
function perfBars(obj, order){
  var keys = order || Object.keys(obj);
  return keys.filter(function(k){return obj[k];}).map(function(k){
    var v = obj[k];
    var pct = v.total ? Math.round(v.correct/v.total*100) : 0;
    return '<div class="perf-bar-row"><div class="label">'+escapeHtmlPlain(k)+'</div><div class="perf-bar-track"><div class="perf-bar-fill" style="width:'+pct+'%"></div></div><div class="val">'+pct+'%</div></div>';
  }).join("");
}
function viewResult(){
  var r = App.lastResult;
  if(!r) return backBar()+'<div class="empty">No result to show.</div>';
  return ''
  + '<div class="score-hero">'
  +   '<div class="big">'+r.correct+' / '+r.total+'</div>'
  +   '<div class="pct">'+r.percentage.toFixed(1)+'% &middot; UPSC-style marks: '+r.upscMarks+' / '+r.maxMarks+'</div>'
  + '</div>'
  + '<div class="card"><div class="stat-grid">'
  +   statBox(r.attempted,"Attempted") + statBox(r.correct,"Correct") + statBox(r.incorrect,"Incorrect") + statBox(r.unanswered,"Unanswered") + statBox(r.accuracy.toFixed(1)+"%","Accuracy")
  +   statBox(fmtTimeHuman(r.timeTakenSec),"Time Taken") + statBox(fmtTimeHuman(r.avgTimePerAttempted),"Avg / Attempted")
  + '</div></div>'
  + '<div class="card"><h3>Performance by Unit</h3>'+perfBars(r.perUnit, UNIT_ORDER)+'</div>'
  + '<div class="card"><h3>Performance by Topic</h3>'+perfBars(r.perTopic)+'</div>'
  + '<div class="card"><h3>Performance by Question Type</h3>'+perfBars(r.perType)+'</div>'
  + '<div class="btn-row">'
  +   '<button class="btn btn-primary" data-action="go-view" data-view="review">View Full Review</button>'
  +   '<button class="btn" data-action="retry-incorrect">Retry Incorrect</button>'
  +   '<button class="btn" data-action="retry-unanswered">Retry Unanswered</button>'
  +   '<button class="btn btn-ghost" data-action="go-home">Back to Home</button>'
  + '</div>';
}
function statBox(val,label){ return '<div class="stat-box"><b>'+val+'</b><span>'+label+'</span></div>'; }

/* ---------------- Review screen ---------------- */
function viewReview(){
  var m = App.mock;
  if(!m) return backBar()+'<div class="empty">No mock to review.</div>';
  var bookmarks = lsGet("bookmarks", []);
  var filters = [
    ["all","All"], ["correct","Correct"], ["incorrect","Incorrect"],
    ["unanswered","Unanswered"], ["marked","Marked"], ["bookmarked","Bookmarked"]
  ];
  var chips = filters.map(function(f){
    return '<div class="chip '+(App.reviewFilter===f[0]?"active":"")+'" data-action="review-filter" data-f="'+f[0]+'">'+f[1]+'</div>';
  }).join("");
  var items = m.questions.map(function(q,i){ return {q:q, i:i}; }).filter(function(o){
    var a = m.answers[o.i];
    if(App.reviewFilter==="correct") return a===o.q.correctAnswer;
    if(App.reviewFilter==="incorrect") return a!==undefined && a!==o.q.correctAnswer;
    if(App.reviewFilter==="unanswered") return a===undefined;
    if(App.reviewFilter==="marked") return !!m.marked[o.i];
    if(App.reviewFilter==="bookmarked") return bookmarks.indexOf(o.q.id)!==-1;
    return true;
  });
  var body = items.length ? items.map(function(o){ return reviewCard(o.q, o.i, m); }).join("") : '<div class="empty">No questions match this filter.</div>';
  return backBar()
    + '<div class="card"><h2>Review: '+escapeHtmlPlain(m.title)+'</h2><div class="chip-row">'+chips+'</div></div>'
    + body;
}
function reviewCard(q, i, m){
  var a = m.answers[i];
  var bookmarks = lsGet("bookmarks", []);
  var isBookmarked = bookmarks.indexOf(q.id) !== -1;
  var optionsHtml = q.options.map(function(opt, idx){
    var cls = "option locked";
    if(idx===q.correctAnswer) cls += " correct";
    else if(idx===a) cls += " incorrect";
    return '<div class="'+cls+'"><span class="optlabel">'+"ABCD"[idx]+'</span><span class="opttext">'+renderQuestionText(opt)+'</span></div>';
  }).join("");
  var status = a===undefined ? '<span class="badge">Unanswered</span>' : (a===q.correctAnswer ? '<span class="badge" style="background:var(--success-bg);color:var(--success);border-color:#bfe9cf;">Correct</span>' : '<span class="badge" style="background:var(--danger-bg);color:var(--danger);border-color:#f2c6c2;">Incorrect</span>');
  var reviewMetaBadges = q.isForecast
    ? badge(q.section, "badge-ai") + badge(q.topic) + (q.subtopic && q.subtopic!==q.topic ? badge(q.subtopic) : "") + status
    : q.isPrestorm
    ? badge("Test "+q.testNo+" Q"+q.questionNumber, "badge-ai") + badge(unitShort(q.unit), unitBadgeClass(q.unit)) + badge(q.subtopic) + status
    : badge(q.year+" Q"+q.questionNumber)+badge(unitShort(q.unit), unitBadgeClass(q.unit))+badge(q.subtopic)+status;
  var reviewForecastBanner = q.isForecast ? '<div class="forecast-banner">🔮 '+escapeHtmlPlain(q.provenanceLabel||"FORECAST / AI-GENERATED")+'</div>'
    : q.isPrestorm ? '<div class="forecast-banner">🧪 '+escapeHtmlPlain(q.provenanceLabel||"PRESTORM MOCK SERIES - answer key as printed, shortcut AI-derived")+'</div>' : "";
  return '<div class="card qcard">'
    + reviewForecastBanner
    + '<div class="qmeta">'+reviewMetaBadges
    +   '<button class="btn btn-ghost btn-sm" style="margin-left:auto;" data-action="toggle-bookmark" data-id="'+q.id+'">'+(isBookmarked?"★":"☆")+'</button></div>'
    + (q.sharedStem ? '<div class="shared-stem"><span class="tag">Shared context</span>'+renderRich(q.sharedStem)+'</div>' : "")
    + '<div class="qtext">'+renderRich(q.question)+'</div>'
    + (q.trailingNote ? '<div class="trailing-note">'+renderQuestionText(q.trailingNote)+'</div>' : "")
    + '<div class="options">'+optionsHtml+'</div>'
    + '<div class="feedback-panel">'
    +   '<div class="reveal-block"><h4>Exam Shortcut <span class="ai-note">AI-derived explanation</span></h4>'+renderQuestionText(q.examShortcut||"Not available.")+'</div>'
    +   ((q.tipsTricks && q.tipsTricks.length) ? '<div class="reveal-block"><h4>Tips &amp; Tricks</h4><ul>'+q.tipsTricks.map(function(t){return "<li>"+renderQuestionText(t)+"</li>";}).join("")+'</ul></div>' : "")
    +   ((q.solution && q.solution.length) ? '<div class="reveal-block"><h4>Step-by-Step Solution</h4><ol>'+q.solution.map(function(s){return "<li>"+renderQuestionText(s.text)+"</li>";}).join("")+'</ol></div>' : "")
    +   (q.sourceAmbiguityNote ? '<div class="source-note"><b>Source note:</b> '+renderQuestionText(q.sourceAmbiguityNote)+'</div>' : "")
    + '</div>'
    + '</div>';
}

/* ---------------- Analytics ---------------- */
function viewAnalytics(){
  var ga = computeGlobalAnalytics();
  var overallAcc = ga.totalAttempts ? (ga.totalCorrect/ga.totalAttempts*100) : 0;
  var weak = weakTopics(1, 8);
  var hist = lsGet("history", []).slice(0,15).reverse();
  var trendHtml = hist.length ? hist.map(function(h){
    return '<div class="perf-bar-row"><div class="label">'+fmtDate(h.timestamp)+'</div><div class="perf-bar-track"><div class="perf-bar-fill" style="width:'+Math.round(h.percentage)+'%"></div></div><div class="val">'+Math.round(h.percentage)+'%</div></div>';
  }).join("") : '<p class="muted">No attempts yet.</p>';
  return backBar()
    + '<div class="card"><h2>Analytics</h2><div class="stat-grid">'
    +   statBox(ga.totalAttempts,"Total Attempts") + statBox(ga.totalCorrect,"Total Correct") + statBox(overallAcc.toFixed(1)+"%","Overall Accuracy")
    + '</div></div>'
    + '<div class="card"><h3>Performance by Unit</h3>'+perfBars(objFromEntries(ga.byUnit), UNIT_ORDER)+'</div>'
    + '<div class="card"><h3>Weakest Topics</h3>'
    +   (weak.length ? weak.map(function(w){ return '<div class="perf-bar-row"><div class="label">'+escapeHtmlPlain(w.topic)+'</div><div class="perf-bar-track"><div class="perf-bar-fill" style="width:'+Math.round(w.accuracy)+'%"></div></div><div class="val">'+Math.round(w.accuracy)+'%</div></div>'; }).join("") : '<p class="muted">Attempt some mocks to see weak-area analysis.</p>')
    +   '<div class="btn-row" style="margin-top:10px;"><button class="btn btn-primary" data-action="start-weak">Practice My Weak Areas</button></div>'
    + '</div>'
    + '<div class="card"><h3>Recent Score Trend</h3>'+trendHtml+'</div>';
}
function objFromEntries(o){ return o; }

/* ---------------- History ---------------- */
function viewHistory(){
  var hist = lsGet("history", []);

/* ---------------- Search ---------------- */
function viewSearch(){
  var q = App.searchQuery.trim().toLowerCase();
  if(!q) return backBar()+'<div class="card empty"><div class="big-icon">🔎</div><h3>Type in the search box above</h3><p class="muted">Search across question text, year, unit, topic, subtopic and syllabus concept.</p></div>';

    return (item.question+" "+item.year+" "+item.unit+" "+item.topic+" "+item.subtopic+" "+item.syllabusConcept).toLowerCase().indexOf(q)!==-1;

  }).join("");
  return backBar() + '<div class="card"><h2>Search results for "'+escapeHtmlPlain(App.searchQuery)+'" ('+results.length+')</h2>'

    + '</div>';

/* =========================================================================
   9. MODAL
   ========================================================================= */
function showModal(title, bodyHtml, actionsHtml){
  closeModal();
  var overlay = document.createElement("div");
  overlay.id = "modal-overlay";
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(20,25,40,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;";
  overlay.innerHTML = '<div class="card" style="max-width:420px;width:100%;">'
    + '<h3>'+title+'</h3><div style="margin-bottom:14px;">'+bodyHtml+'</div><div class="btn-row">'+actionsHtml+'</div></div>';
  document.body.appendChild(overlay);
}
function closeModal(){
  var el = document.getElementById("modal-overlay");
  if(el) el.remove();
}

/* =========================================================================
   10. EXPORT / IMPORT / RESET
   ========================================================================= */
function exportProgress(){
  var data = {};
  lsAllKeys().forEach(function(k){
    try{ data[k.slice(LS_PREFIX.length)] = JSON.parse(localStorage.getItem(k)); }catch(e){}
  });
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "iss-p2-progress-"+(new Date().toISOString().slice(0,10))+".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  toast("Progress exported.");
}
function importProgressFile(file){
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var data = JSON.parse(reader.result);
      Object.keys(data).forEach(function(k){ lsSet(k, data[k]); });
      toast("Progress imported.");
      render();
    }catch(e){ toast("Import failed: invalid file."); }
  };
  reader.readAsText(file);
}
function resetProgress(){
  showModal("Reset all progress?",
    "<p class='muted'>This clears attempt history, bookmarks, mistakes, stats and settings stored in this browser. This cannot be undone.</p>",
    '<button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-danger" data-action="do-reset">Reset Everything</button>');
}

/* =========================================================================
   11. EVENT HANDLING (delegated)
   ========================================================================= */
function afterRender(){
  var timerEl = document.getElementById("exam-timer");
  if(timerEl && App.mock && App.mock.timeLimitSec){
    timerEl.textContent = fmtTime(App.mock.timeLimitSec - (Date.now()-App.mock.startedAt)/1000);
  }
}

function readCheckedGroup(group){
  var out = [];
  document.querySelectorAll('input[data-group="'+group+'"]:checked').forEach(function(el){
    out.push(decodeURIComponent(el.value));
  });
  return out;
}

document.addEventListener("click", function(e){
  var t = e.target.closest("[data-action]");
  if(!t) return;
  var action = t.getAttribute("data-action");

  switch(action){
    case "go-home": App.view="home"; App.mock=null; render(); break;
    case "go-view": App.view = t.getAttribute("data-view"); App.setupCtx = null; render(); break;

    case "pick-year": App.setupCtx = {year: Number(t.getAttribute("data-year"))}; App.view="setupYear"; render(); break;
    case "start-year": startMock(buildYearMock(Number(t.getAttribute("data-year")))); break;

    case "pick-sectional": App.setupCtx = {unit: decodeURIComponent(t.getAttribute("data-unit"))}; App.view="setupSectional"; render(); break;
    case "start-sectional": {
      var unit = decodeURIComponent(t.getAttribute("data-unit"));
      var yearSel = document.getElementById("sec-year").value;
      var year = yearSel==="all" ? "all" : Number(yearSel);
      var mode = document.querySelector('input[name="sec-mode"]:checked').value;
      startMock(buildSectionalMock(unit, year, mode));
      break;
    }

    case "start-topic": {
      var subMode = t.getAttribute("data-subtopicmode")==="1";
      var uu = decodeURIComponent(document.getElementById("tm-unit").value);
      var tt = decodeURIComponent(document.getElementById("tm-topic").value);
      var st = subMode ? decodeURIComponent(document.getElementById("tm-subtopic").value) : null;
      var md = document.querySelector('input[name="tm-mode"]:checked').value;
      startMock(buildTopicMock(uu, tt, st, md));
      break;
    }

    case "start-simple": {
      var kind = t.getAttribute("data-kind");
      var md2 = document.querySelector('input[name="'+kind+'-mode"]:checked').value;
      startMock(kind==="mistakes" ? buildMistakeMock(md2) : buildBookmarkMock(md2));
      break;
    }
    case "pick-forecast-section": App.setupCtx = {section: decodeURIComponent(t.getAttribute("data-section"))}; App.view="setupForecastSection"; render(); break;
    case "start-forecast": {
      var section = decodeURIComponent(t.getAttribute("data-section"));
      var setAttr = t.getAttribute("data-set");
      var setNo = setAttr ? Number(setAttr) : null;
      startMock(buildForecastMock(section, setNo));
      break;
    }
    case "start-prestorm-test": startMock(buildPrestormTestMock(Number(t.getAttribute("data-test")))); break;
    case "pick-prestorm-section": App.setupCtx = {unit: decodeURIComponent(t.getAttribute("data-unit"))}; App.view="setupPrestormSection"; render(); break;
    case "start-prestorm-section": {
      var pUnit = decodeURIComponent(t.getAttribute("data-unit"));
      var pSetAttr = t.getAttribute("data-set");
      var pSetNo = pSetAttr ? Number(pSetAttr) : null;
      startMock(buildPrestormSectionMock(pUnit, pSetNo));
      break;
    }
    case "start-weak": {
      var wm = buildWeakAreaMock();
      if(!wm) toast("Attempt more questions first to build weak-area analytics.");
      else startMock(wm);
      break;
    }

    case "start-custom": startMock(buildCustomMock(App.customSel)); break;

    case "start-search-mock": {
      var q3 = App.searchQuery.trim().toLowerCase();
      var results = ALL_Q.filter(function(item){
        return (item.question+" "+item.year+" "+item.unit+" "+item.topic+" "+item.subtopic+" "+item.syllabusConcept).toLowerCase().indexOf(q3)!==-1;
      }).slice(0,150);
      startMock(makeMock("Search: "+App.searchQuery, "learning", results, null));
      break;
    }

    case "answer": {
      var idx = Number(t.getAttribute("data-idx"));
      var m = App.mock; var i = m.current;
      if(m.mode==="learning" && m.answers[i]!==undefined) break;
      m.answers[i] = idx;
      render();
      break;
    }
    case "prev": App.mock.current = Math.max(0, App.mock.current-1); render(); break;
    case "next": App.mock.current = Math.min(App.mock.questions.length-1, App.mock.current+1); render(); break;
    case "jump": App.mock.current = Number(t.getAttribute("data-idx")); render(); break;
    case "toggle-mark": {
      var i3 = App.mock.current;
      App.mock.marked[i3] = !App.mock.marked[i3];
      render();
      break;
    }
    case "toggle-bookmark": {
      var qid = t.getAttribute("data-id");
      var bm = lsGet("bookmarks", []);
      var pos = bm.indexOf(qid);
      if(pos===-1){ bm.push(qid); toast("Bookmarked."); } else { bm.splice(pos,1); toast("Bookmark removed."); }
      lsSet("bookmarks", bm);
      render();
      break;
    }

    case "confirm-submit": {
      var m3 = App.mock;
      var answered = Object.keys(m3.answers).length;
      var unanswered = m3.questions.length - answered;
      var marked = Object.keys(m3.marked).filter(function(k){return m3.marked[k];}).length;
      showModal("Submit "+(m3.mode==="strict"?"Exam":"Mock")+"?",
        "<p>Answered: <b>"+answered+"</b> &middot; Unanswered: <b>"+unanswered+"</b> &middot; Marked for review: <b>"+marked+"</b></p><p class='muted'>You cannot change answers after submitting.</p>",
        '<button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" data-action="do-submit">Yes, Submit</button>');
      break;
    }
    case "do-submit": submitMock(false); break;
    case "close-modal": closeModal(); break;

    case "retry-incorrect": {
      var wrongIds = App.mock.questions.filter(function(q,i){ return App.mock.answers[i]!==undefined && App.mock.answers[i]!==q.correctAnswer; }).map(function(q){return q.id;});
      if(!wrongIds.length){ toast("No incorrect answers to retry."); break; }
      var qs = wrongIds.map(function(id){return BY_ID[id];});
      startMock(makeMock("Retry Incorrect", "learning", qs, null));
      break;
    }
    case "retry-unanswered": {
      var unansIds = App.mock.questions.filter(function(q,i){ return App.mock.answers[i]===undefined; }).map(function(q){return q.id;});
      var qs2 = unansIds.map(function(id){return BY_ID[id];});
      if(!qs2.length){ toast("No unanswered questions."); break; }
      startMock(makeMock("Retry Unanswered", "strict", qs2, qs2.length*90));
      break;
    }

    case "review-filter": App.reviewFilter = t.getAttribute("data-f"); render(); break;
    case "view-history-review": {
      var hist2 = lsGet("history", []);
      var h = hist2[Number(t.getAttribute("data-idx"))];
      if(!h) break;
      var qs3 = h.questionIds.map(function(id){return BY_ID[id];}).filter(Boolean);
      App.mock = {title:h.title, mode:h.mode, questions:qs3, answers:h.answers||{}, marked:h.marked||{}, revealStage:{}, current:0, submitted:true};
      App.reviewFilter = "all";
      App.view = "review";
      render();
      break;
    }

    case "toggle-theme": toggleTheme(); break;
    case "export-progress": exportProgress(); break;
    case "import-progress": document.getElementById("import-file-input").click(); break;
    case "reset-progress": resetProgress(); break;
    case "do-reset": {
      lsAllKeys().forEach(function(k){ localStorage.removeItem(k); });
      closeModal();
      toast("All progress reset.");
      App.view="home"; App.mock=null;
      render();
      break;
    }
    default: break;
  }
});

document.addEventListener("change", function(e){
  var el = e.target;
  if(el.id === "tm-unit"){
    var u = decodeURIComponent(el.value);
    App.setupCtx = {unit: u, topic: topicsForUnit(u)[0]};
    render();
    return;
  }
  if(el.id === "tm-topic"){
    var u2 = (App.setupCtx && App.setupCtx.unit) || UNITS[0];
    var tp = decodeURIComponent(el.value);
    App.setupCtx = {unit:u2, topic:tp};
    render();
    return;
  }
  /* Only year/unit/topic/subtopic selection changes the available pool and
     dependent topic/subtopic lists, so only those warrant a full re-render.
     Count/order/mode/randomize are read live from the DOM at start-custom
     time as well, but we mirror them into state immediately (without a
     disruptive full re-render) so App.customSel stays authoritative. */
  if(el.matches('input[data-group^="cm-"]')){
    App.customSel.years = readCheckedGroup("cm-year").map(Number);
    App.customSel.units = readCheckedGroup("cm-unit");
    App.customSel.topics = readCheckedGroup("cm-topic");
    App.customSel.subtopics = readCheckedGroup("cm-subtopic");
    render();
    return;
  }
  if(el.id === "cm-count"){ App.customSel.count = Number(el.value)||40; }
  if(el.id === "cm-order"){ App.customSel.order = el.value; }
  if(el.name === "cm-mode"){ App.customSel.mode = el.value; }
  if(el.id === "cm-randopt"){ App.customSel.randomizeOptions = el.checked; }
  if(el.id === "import-file-input" && el.files && el.files[0]){
    importProgressFile(el.files[0]);
    el.value = "";
  }
});
document.addEventListener("input", function(e){
  if(e.target.id === "cm-count"){ App.customSel.count = Number(e.target.value)||40; }
});

var searchDebounce;
document.addEventListener("input", function(e){
  if(e.target.id === "global-search"){
    App.searchQuery = e.target.value;
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(function(){
      if(App.searchQuery.trim()){ App.view = "search"; render(); document.getElementById("global-search").focus(); document.getElementById("global-search").value = App.searchQuery; }
    }, 250);
  }
});

/* Keyboard shortcuts: 1-4 options, arrows nav, M mark. Disabled while typing. */
document.addEventListener("keydown", function(e){
  var tag = (e.target.tagName||"").toLowerCase();
  if(tag==="input" || tag==="textarea" || tag==="select") return;
  if(App.view !== "exam" || !App.mock) return;
  if(["1","2","3","4"].indexOf(e.key)!==-1){
    var idx = Number(e.key)-1;
    var m = App.mock, i = m.current;
    if(idx < m.questions[i].options.length){
      if(!(m.mode==="learning" && m.answers[i]!==undefined)){
        m.answers[i] = idx;
        render();
      }
    }
  } else if(e.key === "ArrowLeft"){
    App.mock.current = Math.max(0, App.mock.current-1); render();
  } else if(e.key === "ArrowRight"){
    App.mock.current = Math.min(App.mock.questions.length-1, App.mock.current+1); render();
  } else if(e.key === "m" || e.key === "M"){
    var i2 = App.mock.current;
    App.mock.marked[i2] = !App.mock.marked[i2];
    render();
  }
});

} else {
  render();
}

})();
